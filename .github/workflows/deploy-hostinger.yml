name: Deploy Hostinger (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Force upload dist/ into public_html
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -f dist/index.html

          lftp_cmd() {
            lftp -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set ftp:passive-mode yes; set net:timeout 30; set net:max-retries 5; set cmd:fail-exit yes; open -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST}; $1; bye"
          }

          echo "=== FTP root ==="
          lftp_cmd "pwd; ls" || true

          DEST=""
          for candidate in \
            "domains/orionpeptideos.com/public_html" \
            "public_html" \
            "."
          do
            echo "=== trying ${candidate} ==="
            if lftp_cmd "cd ${candidate}; pwd"; then
              DEST="$candidate"
              break
            fi
          done

          if [ -z "$DEST" ]; then
            echo "Nao achei public_html no FTP"
            exit 1
          fi

          echo "=== uploading into ${DEST} ==="
          lftp_cmd "cd ${DEST}; pwd; ls; lcd dist; mirror -R --verbose --overwrite --parallel=4 --exclude-glob .well-known --exclude-glob .well-known/**; echo '--- after ---'; ls; ls index.html"
